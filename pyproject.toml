[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "refgauge"
dynamic = ["version"]
description = "Audit reference dependence and held-out study transport in cross-study omics."
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
  {name = "Sabih Ur Rehman Syed"}
]
keywords = [
  "reference sensitivity", "meta-analysis", "cross-study", "transportability",
  "reproducibility", "transcriptomics", "organoids"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: BSD License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Bio-Informatics"
]
dependencies = [
  "numpy>=1.24,<3",
  "pandas>=2.0,<4",
  "scipy>=1.10,<2",
  "matplotlib>=3.7,<4"
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "check-wheel-contents>=0.6,<1",
  "pytest>=8.0,<10",
  "pytest-cov>=5.0,<8",
  "ruff>=0.6,<1",
  "twine>=5,<8"
]

[project.scripts]
refgauge = "refgauge.cli:main"

[project.urls]
Homepage = "https://github.com/Sneakypeat/RefGauge"
Documentation = "https://github.com/Sneakypeat/RefGauge#readme"
Issues = "https://github.com/Sneakypeat/RefGauge/issues"
Changelog = "https://github.com/Sneakypeat/RefGauge/blob/main/CHANGELOG.md"
Source = "https://github.com/Sneakypeat/RefGauge"

[tool.hatch.version]
path = "src/refgauge/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/refgauge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"

[tool.coverage.run]
branch = true
source = ["refgauge"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
