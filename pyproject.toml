[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "contrastcal"
version = "0.1.0"
description = "Calibrate cross-study biological contrasts against direct within-study evidence."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
  {name = "Sabih Ur Rehman Syed"}
]
keywords = [
  "calibration", "meta-analysis", "cross-study", "reproducibility",
  "transcriptomics", "organoids"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: BSD License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Bio-Informatics"
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "matplotlib>=3.7"
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6"
]

[project.scripts]
contrastcal = "contrastcal.cli:main"

[project.urls]
Homepage = "https://github.com/Sneakypeat/ContrastCal"
Documentation = "https://github.com/Sneakypeat/ContrastCal#readme"
Issues = "https://github.com/Sneakypeat/ContrastCal/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/contrastcal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

