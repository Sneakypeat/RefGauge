name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest --cov=refgauge --cov-branch --cov-report=term-missing
      - run: refgauge --version
      - run: refgauge demo --output /tmp/refgauge-demo
        env:
          MPLCONFIGDIR: /tmp/refgauge-matplotlib

  minimum-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Install declared runtime minima
        run: >-
          python -m pip install
          "numpy==1.24.0"
          "pandas==2.0.0"
          "scipy==1.10.0"
          "matplotlib==3.7.0"
      - run: python -m pip check
      - run: python -m pytest

  build:
    needs: [test, minimum-dependencies]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: >-
          python -m pip install
          "build>=1.2,<2"
          "check-wheel-contents>=0.6,<1"
          "twine>=5,<7"
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - run: check-wheel-contents dist/*.whl
      - name: Install and smoke-test wheel
        run: |
          python -m venv /tmp/refgauge-wheel
          /tmp/refgauge-wheel/bin/python -m pip install dist/*.whl
          /tmp/refgauge-wheel/bin/python -m pip check
          /tmp/refgauge-wheel/bin/refgauge --version
          MPLCONFIGDIR=/tmp/refgauge-wheel-mpl /tmp/refgauge-wheel/bin/refgauge demo --output /tmp/refgauge-wheel-demo
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: refgauge-distributions
          path: dist/*
          if-no-files-found: error
